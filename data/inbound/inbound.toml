guard = "A decision credited to a role noun in the third person. Two role sets, both closed. The open roles are owner, maintainer, author, principal, proxy, operator, orchestrator, human, lead, user, and reviewer, each with an optional proxy after it. With an open role the rule reads the possessive on a decision noun (the owner's ruling, the maintainer's call), a verdict verb (the owner ruled, the proxy signed off), the passive by-form (approved by the maintainer, requested by the user), the hyphen compound (owner-flagged), per the role, at the role's request, and on the role's instruction. The ledger roles are owner, maintainer, principal, proxy, orchestrator, and lead, the nouns an agent uses for the person it works for, and with them the rule also reads the loose verbs (the owner wants, the maintainer asked, the owner has ruled), the loose possessives (the owner's request, in the owner's stead), and the bare compound (owner decision, owner-proxy ruling). Three shapes carry no role: a decision noun on an ISO date (ruling (2026-08-20)), a line-start label closed by a colon (Ruling:, Decision:), and the second person aimed at the signer (per your ruling, as you directed). A trailing date joins the span, so a dated stamp reports once. In received text the shape is agent-loop residue: an agent drafting in a person's name records where the choice came from, and the person named never writes about themselves that way, so a cover letter or a proposal carrying the owner's ruling was drafted by something standing outside its signer. The role nouns collide with ordinary English at a real base rate. Minutes record the board's decision, a contract is approved by the reviewer, a novel's author decides, and an OAuth flow has the user approve, so every hit is read against the document's purpose and a forwarded decision record can carry the shape legitimately. The loose verbs stay off the open roles, so the user asked and the author said never fire. Term-of-art compounds stay out of the compound arm: user-defined, user-specified, and user-selected name a mechanism, and a value set by the user is a config fact, so the verb sets carry verdict verbs only. The roleless verb-plus-date stamp (ruled 2026-08-14) is SD-Q006 and reports there. Read per hit."
